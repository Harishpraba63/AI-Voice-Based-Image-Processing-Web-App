<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | AI Image Processor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="brand-badge">AI Processor</div>
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to continue image processing with voice commands.</p>

            {% if error %}
                <div class="alert">{{ error }}</div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn-primary">Login</button>
            </form>

            <p class="foot-text">
                New user? <a href="{{ url_for('register') }}">Create account</a>
            </p>
            <p class="hint-text">Default admin: <strong>admin / admin123</strong></p>
        </div>
    </div>
</body>
</html>
